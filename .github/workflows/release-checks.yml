name: Release checks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Offline fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - name: Select the Windows venv
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Join-Path $PWD '.venv\Scripts') >> $env:GITHUB_PATH
      - name: Select the macOS or Linux venv
        if: runner.os != 'Windows'
        shell: bash
        run: printf '%s\n' "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/analysis_job -v
